name: Notify blog deployment

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch content revision to blog repository
        env:
          BLOG_REPO_DISPATCH_TOKEN: ${{ secrets.BLOG_REPO_DISPATCH_TOKEN }}
        run: |
          if [[ -z "$BLOG_REPO_DISPATCH_TOKEN" ]]; then
            echo "::warning::Set the BLOG_REPO_DISPATCH_TOKEN secret to trigger blog deployments."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url https://api.github.com/repos/libredove/cfbs/dispatches \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $BLOG_REPO_DISPATCH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "{\"event_type\":\"content-updated\",\"client_payload\":{\"sha\":\"$GITHUB_SHA\"}}"
